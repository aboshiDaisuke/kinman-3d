<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>金萬 3D</title>
  <meta name="description" content="秋田銘菓・金萬をいろいろな角度から眺められる3Dビューア（非公式ファンメイド）" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@600;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Ccircle cx=%2216%22 cy=%2216%22 r=%2215%22 fill=%22%23d99a58%22/%3E%3Cellipse cx=%2216%22 cy=%2216%22 rx=%226%22 ry=%228.5%22 fill=%22none%22 stroke=%22%238a3b17%22 stroke-width=%222%22/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="style.css" />
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <main class="stage">
    <canvas id="view" aria-label="金萬の3Dモデル。ドラッグでどの向きにも回転、ホイールやピンチで拡大縮小、矢印キーでも回転できます。"></canvas>

    <header class="masthead">
      <p class="kicker">秋田銘菓</p>
      <h1 class="title">金萬</h1>
      <p class="reading">きんまん</p>
    </header>

    <aside class="spec" aria-label="モデルについて">
      <p class="spec-label">モデル寸法</p>
      <dl>
        <div><dt>直径</dt><dd>約4.6<span>cm</span></dd></div>
        <div><dt>厚さ</dt><dd>約1.6<span>cm</span></dd></div>
      </dl>
      <p>蜂蜜と卵のカステラ生地で<br />玉子入りの白あんを包んだ焼き菓子</p>
    </aside>

    <div class="loading" id="loading" role="status">
      <span class="loading-mark" aria-hidden="true"></span>
      <span>焼き上げ中…</span>
    </div>

    <div class="bottom">
      <p class="hint">
        <span class="hint-long">ドラッグで好きな向きに回転 ・ ホイール／ピンチで拡大 ・ ダブルクリックで元の向き</span>
        <span class="hint-short">ドラッグで回転 ・ ピンチで拡大</span>
      </p>

      <nav class="dock" aria-label="視点の切り替え">
        <div class="views" role="group" aria-label="視点">
          <button type="button" data-view="front" aria-pressed="true">斜め</button>
          <button type="button" data-view="top" aria-pressed="false">真上</button>
          <button type="button" data-view="side" aria-pressed="false">真横</button>
          <button type="button" data-view="bottom" aria-pressed="false">底</button>
        </div>
        <div class="actions">
          <button type="button" id="split" class="primary" aria-pressed="false">
            <span class="when-closed">割ってみる</span><span class="when-open">元に戻す</span>
          </button>
          <button type="button" id="spin" class="icon" aria-pressed="true" aria-label="自動回転">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.34-5.66" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M20 4v4.5h-4.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
      </nav>

      <p class="credit">非公式のファンメイド3Dモデルです</p>
    </div>
  </main>

  <script type="module" src="main.js"></script>
</body>
</html>
